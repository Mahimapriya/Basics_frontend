<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(9, 7, 7);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;


        }
        .card{
           background-color: rgb(233, 226, 226); 
           padding: 40px;
           border-radius: 10px;
           width: 300px;;    
        }
        h2{
            text-align: center;
            margin-bottom: 30
            px;
            margin-top: -10px;
            color: rgb(28, 28, 183);

        }
        form{
            display: flex;
            flex-direction: column;
            gap: 10px;

        }
        input{
            padding: 5px;
            border-radius: 5px;
            background-color: rgb(231, 233, 227);
            border: 1px color(srgb rgb(14, 13, 13) green blue);
            border: none;
        }
        button{
        
            border-radius: 5px;
            padding: 10px;
            color: white;
            background-color: rgb(111, 201, 231);

        }
        button:hover{
            background-color:rgb(2, 2, 96)
        }
    </style>

</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="email" placeholder="Email"> 
            <input type="password" placeholder="Password"> 
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
