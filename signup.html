<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(9, 7, 7);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;


        }
        .card{
           background-color: rgb(246, 248, 203); 
           padding: 40px;
           border-radius: 10px;
           width: 350px;;    
        }
        h2{
            text-align: center;
            margin-bottom: 30
            px;
            margin-top: 10px;
            color: rgb(63, 166, 7);

        }
        form{
            display: flex;
            flex-direction: column;
            gap: 15px;

        }
        input{
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            background-color: rgb(231, 233, 227);
            border: 1px color(srgb rgb(14, 13, 13) green blue);
            border: none;
            flex: 1;
            

        }
        .name{
            display: flex;
            gap: 10px;

        }
        button{
        
            border-radius: 5px;
            padding: 10px;
            color: rgb(20, 19, 19);
            background-color: rgb(206, 254, 110);

        }
        button:hover{
            background-color:rgb(77, 218, 11)
        }
    </style>

</head>
<body>
    <div class="card">
        <h2>Signup</h2>
        <form>
            <input type="email" placeholder="Email"> 
            <div class="name">
                <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
        </div>
            <input type="password" placeholder="Password"> 
            <button type="submit">Signup</button>
        </form>
    </div>
</body>
</html>
